[pytest]
; backend/*.py modules import each other top-level-style (e.g.
; `from config.settings import settings`, matching how the app itself runs
; — see backend/Dockerfile, which COPYs backend/ to WORKDIR /app so those
; imports resolve there). Without this, `python -m pytest tests/unit/ -v`
; from the repo root fails to even collect (ModuleNotFoundError: 'config'),
; which pre-dates this change. This just makes that path resolve too,
; alongside the repo-root path tests/conftest.py already adds for the
; `backend.xxx` import style some existing tests use.
pythonpath = backend
