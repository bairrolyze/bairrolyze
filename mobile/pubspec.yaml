name: homescope
description: Know your neighborhood before you move.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^17.3.0

  # HTTP
  dio: ^5.4.0

  # Maps
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # Storage
  shared_preferences: ^2.2.2
  hive_flutter: ^1.1.0

  # UI
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0

  # URL launching
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.20.3
  uuid: ^4.3.3
  logger: ^2.1.0
  connectivity_plus: ^7.3.1

  # In-app purchases (RevenueCat)
  purchases_flutter: ^10.7.0

  # Splash screen
  flutter_native_splash: ^2.4.0
  geolocator: ^14.0.3
  # Device magnetometer heading for the transit radar's live compass.
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App icons
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/config/
