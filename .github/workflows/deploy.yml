name: Build and Deploy to Azure

# Single pipeline: build the backend image, push it to GHCR, then roll a new
# revision of the api-home-scope Azure Container App onto that image.
#
# Why this shape:
#   * api-home-scope is an Azure Container App (*.azurecontainerapps.io), NOT an
#     App Service Web App — so azure/webapps-deploy does not apply.
#   * The Container App already has GHCR pull credentials configured, so deploy
#     is just "point it at the new image tag" via `az containerapp update`.
#   * Pushing :latest alone does not trigger a new revision; we deploy the
#     immutable :<sha> tag so every push produces a fresh, rollback-able revision.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # push image to GHCR
  id-token: write      # OIDC login to Azure

env:
  IMAGE: ghcr.io/rajesharyain/home-scope
  CONTAINERAPP_NAME: api-home-scope
  RESOURCE_GROUP: homescope-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APIHOMESCOPE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APIHOMESCOPE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APIHOMESCOPE_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision to Azure Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "$CONTAINERAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --container-name "$CONTAINERAPP_NAME" \
              --image "${IMAGE}:${{ github.sha }}"
