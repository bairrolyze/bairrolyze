name: Trigger auto deployment for api-home-scope

on:
  push:
    branches: 
      [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APIHOMESCOPE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APIHOMESCOPE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APIHOMESCOPE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.APIHOMESCOPE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APIHOMESCOPE_REGISTRY_PASSWORD }}
          containerAppName: api-home-scope
          resourceGroup: homescope-rg
          imageToBuild: ghcr.io/rajesharyain/home-scope:${{ github.sha }}